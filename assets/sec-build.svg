<svg xmlns="http://www.w3.org/2000/svg" width="900" height="80" viewBox="0 0 900 80" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes glow{0%,100%{opacity:0}50%{opacity:.4}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.fu{animation:fadeUp .9s cubic-bezier(.2,.8,.2,1) both}
.gr{transform-box:fill-box;transform-origin:50% 100%;animation:grow 1.1s cubic-bezier(.2,.9,.2,1) both}
.gx{transform-box:fill-box;transform-origin:0 50%;animation:growX 1.3s cubic-bezier(.2,.8,.2,1) both}
@keyframes floorIn{0%{transform:scaleY(0);opacity:0}6%{transform:scaleY(1);opacity:1}92%{transform:scaleY(1);opacity:1}98%,100%{transform:scaleY(0);opacity:0}}
@keyframes towerIn{0%{transform:scaleY(0)}9%{transform:scaleY(1)}66%{transform:scaleY(1)}72%,100%{transform:scaleY(0)}}
.fl{transform-box:fill-box;transform-origin:50% 100%;animation:floorIn 16s cubic-bezier(.3,.8,.3,1) infinite both}
.tw{transform-box:fill-box;transform-origin:50% 100%;animation:towerIn 16s cubic-bezier(.2,.9,.2,1) infinite both}
.pl{animation:pulse 2.6s ease-in-out infinite}
.gl{animation:glow 2.2s ease-in-out infinite}
.bk{animation:blink 1.1s step-end infinite}
</style><defs><linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset=".6" stop-color="#2dd4bf" stop-opacity=".35"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></linearGradient><filter id="bl"><feGaussianBlur stdDeviation="2.2"/></filter></defs><rect x="0" y="14" width="4" height="34" rx="2" fill="#2dd4bf" class="pl"/>
<text x="18" y="30" font-family="'JetBrains Mono','SF Mono',ui-monospace,Consolas,monospace" font-size="12" font-weight="700" letter-spacing="3" fill="#5eead4" class="fu" style="animation-delay:0.00s">01 / PROCESS</text>
<text x="18" y="56" font-family="'Segoe UI','Inter',system-ui,-apple-system,Arial,sans-serif" font-size="30" font-weight="800" fill="#d1fae5" class="fu" style="animation-delay:0.15s">How I build</text>
<rect x="0" y="68" width="900" height="2" fill="url(#ln)" class="gx" style="animation-delay:.3s"/>
<circle cy="69" r="4" fill="#7df9e4" filter="url(#bl)"><animate attributeName="cx" values="0;900" dur="4.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="4.5s" repeatCount="indefinite"/></circle></svg>