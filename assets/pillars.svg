<svg xmlns="http://www.w3.org/2000/svg" width="900" height="140" viewBox="0 0 900 140">
  <defs>
    <linearGradient id="bd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#39FF14"/>
      <stop offset="1" stop-color="#00E5FF"/>
    </linearGradient>
    <filter id="g" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" text-anchor="middle">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 6;0 -2;0 6" dur="4s" begin="0s" repeatCount="indefinite"/>
      <rect x="2" y="2" width="276" height="112" rx="16" fill="#0a0f0d" stroke="url(#bd)" stroke-width="2" filter="url(#g)">
        <animate attributeName="stroke-opacity" values="1;0.35;1" dur="4s" begin="0s" repeatCount="indefinite"/>
      </rect>
      <text x="140" y="56" font-size="22" font-weight="700" fill="#FFFFFF">🤖 AI Systems</text>
      <text x="140" y="86" font-size="13" fill="#00E5FF">LLMs · RAG · Computer Vision</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 6;0 -2;0 6" dur="4s" begin="0.6s" repeatCount="indefinite"/>
      <rect x="312" y="2" width="276" height="112" rx="16" fill="#0a0f0d" stroke="url(#bd)" stroke-width="2" filter="url(#g)">
        <animate attributeName="stroke-opacity" values="1;0.35;1" dur="4s" begin="0.6s" repeatCount="indefinite"/>
      </rect>
      <text x="450" y="56" font-size="22" font-weight="700" fill="#FFFFFF">🔌 Intelligent IoT</text>
      <text x="450" y="86" font-size="13" fill="#00E5FF">ESP32 · Sensors · Real-time monitoring</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 6;0 -2;0 6" dur="4s" begin="1.2s" repeatCount="indefinite"/>
      <rect x="622" y="2" width="276" height="112" rx="16" fill="#0a0f0d" stroke="url(#bd)" stroke-width="2" filter="url(#g)">
        <animate attributeName="stroke-opacity" values="1;0.35;1" dur="4s" begin="1.2s" repeatCount="indefinite"/>
      </rect>
      <text x="760" y="56" font-size="22" font-weight="700" fill="#FFFFFF">🌐 Shipped Products</text>
      <text x="760" y="86" font-size="13" fill="#00E5FF">React · FastAPI · Vercel</text>
    </g>
  </g>
</svg>
