<svg xmlns="http://www.w3.org/2000/svg" width="900" height="84" viewBox="0 0 900 84"><style>
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes glow{0%,100%{opacity:0}50%{opacity:.4}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.fu{animation:fadeUp .9s cubic-bezier(.2,.8,.2,1) both}
.gr{transform-box:fill-box;transform-origin:50% 100%;animation:grow 1.1s cubic-bezier(.2,.9,.2,1) both}
.gx{transform-box:fill-box;transform-origin:0 50%;animation:growX 1.3s cubic-bezier(.2,.8,.2,1) both}
.pl{animation:pulse 2.6s ease-in-out infinite}
.gl{animation:glow 2.2s ease-in-out infinite}
.bk{animation:blink 1.1s step-end infinite}
</style><defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f4f49"/><stop offset=".5" stop-color="#0a2f31"/><stop offset="1" stop-color="#1c3f63"/></linearGradient>
<radialGradient id="r" cx=".12" cy=".05" r=".6"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".38"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
<radialGradient id="b" cx=".92" cy=".95" r=".5"><stop offset="0" stop-color="#3b82f6" stop-opacity=".28"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></radialGradient>
<radialGradient id="r2"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".22"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".11"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="cardclip"><rect x="1.5" y="1.5" width="897" height="81" rx="26"/></clipPath>
</defs>
<rect x="1.5" y="1.5" width="897" height="81" rx="26" fill="url(#g)" stroke="#2dd4bf" stroke-opacity=".55" stroke-width="1.5"/>
<rect x="1.5" y="1.5" width="897" height="81" rx="26" fill="url(#r)"/>
<rect x="1.5" y="1.5" width="897" height="81" rx="26" fill="url(#b)"/>
<g clip-path="url(#cardclip)"><g><animateTransform attributeName="transform" type="translate" values="0 0;495 21;0 0" dur="16s" repeatCount="indefinite"/><circle cx="90" cy="30" r="342" fill="url(#r2)"/></g></g><text x="40" y="48" font-family="'JetBrains Mono','SF Mono',ui-monospace,Consolas,monospace" font-size="13" font-weight="700" letter-spacing="3" fill="#5eead4">PROJECTS.LIST</text>
<text x="210" y="48" font-family="'JetBrains Mono','SF Mono',ui-monospace,Consolas,monospace" font-size="13" fill="#5eead4" fill-opacity=".8">./projects.sh --all<tspan class="bk">_</tspan></text>
<text x="860" y="48" text-anchor="end" font-family="'JetBrains Mono','SF Mono',ui-monospace,Consolas,monospace" font-size="13" fill="#5eead4" fill-opacity=".8">4 pinned</text>
<line x1="40" y1="64" x2="860" y2="64" stroke="#2dd4bf" stroke-opacity=".4" stroke-dasharray="820" stroke-dashoffset="820"><animate attributeName="stroke-dashoffset" from="820" to="0" dur="1.2s" fill="freeze"/></line><g clip-path="url(#cardclip)"><g><animateTransform attributeName="transform" type="translate" values="-220 0;-220 0;1160 0;1160 0" keyTimes="0;.12;.55;1" dur="9s" repeatCount="indefinite"/><rect x="0" y="-10" width="110" height="104" fill="url(#shine)" transform="skewX(-20)"/></g></g></svg>