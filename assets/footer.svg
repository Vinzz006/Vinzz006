<svg xmlns="http://www.w3.org/2000/svg" width="900" height="130" viewBox="0 0 900 130"><style>
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes glow{0%,100%{opacity:0}50%{opacity:.4}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.fu{animation:fadeUp .9s cubic-bezier(.2,.8,.2,1) both}
.gr{transform-box:fill-box;transform-origin:50% 100%;animation:grow 1.1s cubic-bezier(.2,.9,.2,1) both}
.gx{transform-box:fill-box;transform-origin:0 50%;animation:growX 1.3s cubic-bezier(.2,.8,.2,1) both}
@keyframes floorIn{0%{transform:scaleY(0);opacity:0}6%{transform:scaleY(1);opacity:1}92%{transform:scaleY(1);opacity:1}98%,100%{transform:scaleY(0);opacity:0}}
@keyframes towerIn{0%{transform:scaleY(0)}9%{transform:scaleY(1)}66%{transform:scaleY(1)}72%,100%{transform:scaleY(0)}}
.fl{transform-box:fill-box;transform-origin:50% 100%;animation:floorIn 16s cubic-bezier(.3,.8,.3,1) infinite both}
.tw{transform-box:fill-box;transform-origin:50% 100%;animation:towerIn 16s cubic-bezier(.2,.9,.2,1) infinite both}
.pl{animation:pulse 2.6s ease-in-out infinite}
.gl{animation:glow 2.2s ease-in-out infinite}
.bk{animation:blink 1.1s step-end infinite}
</style><defs></defs><path d="M0 70 q112.5 -26 225 0 q112.5 26 225 0 q112.5 -26 225 0 q112.5 26 225 0 q112.5 -26 225 0 q112.5 26 225 0 q112.5 -26 225 0 q112.5 26 225 0 q112.5 -26 225 0 q112.5 26 225 0 L2250 130 L0 130 Z" fill="#2dd4bf" fill-opacity="0.25"><animateTransform attributeName="transform" type="translate" from="0 0" to="-450 0" dur="9s" repeatCount="indefinite"/></path><path d="M0 82 q112.5 -20 225 0 q112.5 20 225 0 q112.5 -20 225 0 q112.5 20 225 0 q112.5 -20 225 0 q112.5 20 225 0 q112.5 -20 225 0 q112.5 20 225 0 q112.5 -20 225 0 q112.5 20 225 0 L2250 130 L0 130 Z" fill="#22d3ee" fill-opacity="0.22"><animateTransform attributeName="transform" type="translate" from="-450 0" to="0 0" dur="6.5s" repeatCount="indefinite"/></path><path d="M0 94 q112.5 -16 225 0 q112.5 16 225 0 q112.5 -16 225 0 q112.5 16 225 0 q112.5 -16 225 0 q112.5 16 225 0 q112.5 -16 225 0 q112.5 16 225 0 q112.5 -16 225 0 q112.5 16 225 0 L2250 130 L0 130 Z" fill="#4a90e2" fill-opacity="0.3"><animateTransform attributeName="transform" type="translate" from="0 0" to="-450 0" dur="12s" repeatCount="indefinite"/></path><path d="M0 106 q112.5 -12 225 0 q112.5 12 225 0 q112.5 -12 225 0 q112.5 12 225 0 q112.5 -12 225 0 q112.5 12 225 0 q112.5 -12 225 0 q112.5 12 225 0 q112.5 -12 225 0 q112.5 12 225 0 L2250 130 L0 130 Z" fill="#0f4f49" fill-opacity="0.9"><animateTransform attributeName="transform" type="translate" from="-450 0" to="0 0" dur="8s" repeatCount="indefinite"/></path></svg>