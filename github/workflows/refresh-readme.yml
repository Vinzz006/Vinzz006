name: Refresh README Cache

on:
  schedule:
    - cron: '0 0 * * *'   # every day at 00:00 UTC
  workflow_dispatch:        # lets you trigger it manually from the Actions tab too

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Update hidden timestamp
        run: |
          sed -i "s|<!-- last-refreshed:.*-->|<!-- last-refreshed: $(date -u +'%Y-%m-%dT%H:%M:%SZ') -->|" README.md

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: daily readme cache refresh"
          git push
