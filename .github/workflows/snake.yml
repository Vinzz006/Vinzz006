name: github-snake
on:
  # run automatically every 12 hours
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  # run on every push on the main branch
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=%2339FF14&color_dots=%23161b22,%230e4429,%23006d32,%2326a641,%2339d353
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%2339FF14&color_dots=%23161b22,%230e4429,%23006d32,%2326a641,%2339d353

      # push the generated files to the "output" branch
      - name: push github-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
